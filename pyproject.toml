[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mfs"
version = "0.1.0"
description = "Microwave filter synthesis - Python bindings"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
keywords = ["microwave", "filter", "rf", "synthesis", "coupling-matrix"]

[tool.maturin]
features = ["python"]
