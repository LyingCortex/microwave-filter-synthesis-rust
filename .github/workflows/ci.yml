name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  bench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Compile-only: benches are never run in CI (wall-clock / noise), but they
      # must keep building, and the benchmark-standard conformance test must
      # stay green (it also verifies the vendored bench-data/ against
      # MANIFEST.sha256, which is the only tier available without the sibling
      # filter-bench checkout).
      - run: cargo bench --no-run
      - run: cargo test --test benchmark_standard

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, "1.86"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --all-targets

  # The `mfs_cli` binary is gated behind the `cli` feature (required-features),
  # so the default `cargo test --all-targets` above never builds it and
  # `tests/cli_integration.rs` compiles to zero tests. This job builds the
  # binary and runs its black-box end-to-end gate on every OS:
  # - the binary's own unit tests (feature-gated code otherwise never linted), and
  # - the integration suites in `tests/cli_integration.rs` and
  #   `tests/cli_save_resume_e2e.rs` (the save/resume closed-loop gate).
  cli:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features cli --bin mfs_cli
      # Run the binary's own unit tests, not just the black-box integration
      # gate: `parse_matrix_json_flat_and_nested` broke silently when the
      # symmetry invariant was sunk into `new_with_topology` because this
      # feature-gated binary was otherwise only built + integration-tested.
      - run: cargo test --features cli --bin mfs_cli
      # The save/resume closed-loop e2e gate (review §D.6 / P3 #11):
      # `mfs_cli --input` (full pipeline) vs `mfs::pipeline::save_context` +
      # `mfs_cli --resume` must reproduce the same response — non-zero samples
      # within 1e-9 dB, and the transmission-zero samples as deep S21 nulls in
      # both runs. This is the permanent successor to the deleted temporary
      # P3 #11 `examples/` harness. Runs in the same job as `cli_integration`
      # (both need the `cli` feature; the binary is already built above).
      - run: cargo test --features cli --test cli_integration --test cli_save_resume_e2e

  # The `cli` and `python` features hide code behind required-features /
  # optional deps that the default `clippy` job never compiles, so their
  # lints would otherwise stay dormant. Lint both feature-enabled builds.
  feature-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --features cli,python --all-targets -- -D warnings

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml and pyproject.toml versions must match
        run: |
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          py_v=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "Cargo.toml=$cargo_v pyproject.toml=$py_v"
          [ "$cargo_v" = "$py_v" ] || { echo "version drift between Cargo.toml and pyproject.toml"; exit 1; }
